name: ai-visibility-os
x-env: &app-env
  DATABASE_URL: postgres://visibility:${POSTGRES_PASSWORD:?Run setup first}@db:5432/visibility
  APP_URL: ${APP_URL:-http://localhost:3000}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run setup first}
  BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Run setup first}
  MAX_MONTHLY_BUDGET_USD: ${MAX_MONTHLY_BUDGET_USD:-20}
  RETENTION_DAYS: ${RETENTION_DAYS:-365}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-12}
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: visibility
      POSTGRES_DB: visibility
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visibility -d visibility"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    build: { context: ., target: worker }
    command: ["npm", "run", "db:migrate"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  web:
    build: { context: ., target: web }
    environment: *app-env
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  worker:
    build: { context: ., target: worker }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 120s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  proxy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set your real domain}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
